# Core Infrastructure Services
# Traefik, Mailpit

services:
  ###########################################################################
  # traefik
  # docker compose exec -it traefik sh
  #
  # Declaring the user list
  #
  # Note: when used in docker-compose.yml all dollar signs in the hash need to be doubled for escaping.
  # To create user:password pair, it's possible to use this command:
  # echo $(htpasswd -nB user) | sed -e s/\\$/\\$\\$/g
  #
  # Also, note that dollar signs should NOT be doubled when not evaluated (e.g. Ansible docker_container module).
  #
  # SERVICE URLS:
  #   Dashboard:     https://traefik-127-0-0-1.nip.io/dashboard/
  #   Dashboard:     https://traefik-172-235-12-33.nip.io/dashboard/
  ###########################################################################
  traefik:
    # image: traefik:v3.6
    image: dhi.io/traefik:3-debian13-dev
    hostname: traefik
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # - "8080:8080"
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL: ${TRAEFIK_LE_EMAIL:-admin@example.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../config/traefik/traefik.toml:/traefik.toml
      - ../config/traefik/acme.json:/acme.json:rw
      # - ../config/traefik/certs:/etc/ssl/traefik:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 60s
      start_period: 1m
      start_interval: 10s
      timeout: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
          cpus: "0.05"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.tls: "true" # Traefik generates self-signed cert
      # traefik.http.routers.traefik.tls.certresolver: le
      traefik.http.routers.traefik.entrypoints: web,websecure
      traefik.http.routers.traefik.rule: Host(`traefik${DOMAIN_SUFFIX:-.localhost}`)
      traefik.http.services.traefik.loadbalancer.server.port: "8080"
      traefik.http.routers.traefik.middlewares: traefik-auth
      traefik.http.middlewares.traefik-auth.basicauth.users: ${TRAEFIK_CREDS}
      traefik.http.middlewares.traefik-auth.basicauth.removeheader: true
